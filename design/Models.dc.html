<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thalia – Models</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Noto+Sans+Kannada:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #111418; font-family: Inter, 'Noto Sans Kannada', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Models</div>
      <div style="font-size: 13px; color: #565D68">All run offline, 8-bit, on this phone</div>
    </div>

    <div role="radiogroup" aria-label="Active model" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.cardStyle}}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%">
            <div style="display: flex; flex-direction: column; gap: 2px; text-align: left">
              <span style="font-size: 16px; font-weight: 700; color: #111418">{{m.name}}</span>
              <span style="font-size: 12px; color: #565D68">{{m.base}}</span>
            </div>
            <span style="{{m.dotStyle}}"></span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%">
            <div style="display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 11px; color: #565D68">Size</span><span style="font-size: 14px; font-weight: 700; color: #111418">{{m.size}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 11px; color: #565D68">WER</span><span style="font-size: 14px; font-weight: 700; color: #111418">[–]</span></div>
            <div style="display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 11px; color: #565D68">CER</span><span style="font-size: 14px; font-weight: 700; color: #111418">[–]</span></div>
            <div style="display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 11px; color: #565D68">Jargon acc.</span><span style="font-size: 14px; font-weight: 700; color: #111418">[–]</span></div>
          </div>
          <div style="font-size: 12px; font-weight: 600; color: #3B414A; text-align: left; width: 100%">{{m.status}}</div>
        </button>
      </sc-for>
    </div>

    <a href="Compare.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 14px; background: #111418; color: #FFFFFF; font-size: 15px; font-weight: 700">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M12 3v18"></path></svg>
      <span style="color: #FFFFFF">Compare all 3 on one clip</span>
    </a>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 14px; padding: 12px 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 14px; font-weight: 700">Training queue</div>
        <div style="font-size: 12px; color: #565D68">12 corrected clips ready for the next fine-tune</div>
      </div>
      <button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CED5; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; color: #111418; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
        Export
      </button>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE1E6; padding: 8px 8px 26px 8px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg></span>Record</a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg></span>History</a>
    <a href="Models.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 700">
      <span style="display: flex; padding: 4px 16px; border-radius: 999px; background: {{accent}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg></span>Models</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FFD23F","#4CC38A","#7AB8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'a' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const list = [
      { id: 'a', name: 'mech-whisper-small', base: 'Whisper small · full fine-tune', size: '≈250 MB', status: 'Installed · fastest' },
      { id: 'b', name: 'mech-indicwhisper-kn', base: 'IndicWhisper-Kannada · LoRA merged', size: '[size]', status: 'Installed' },
      { id: 'c', name: 'mech-whisper-medium', base: 'Whisper medium · LoRA merged', size: '≈800 MB', status: 'Not downloaded · needs 6 GB+ RAM' }
    ];
    const models = list.map((m) => {
      const on = this.state.active === m.id;
      return {
        ...m,
        checked: on ? 'true' : 'false',
        cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; cursor: pointer; font-family: Inter, sans-serif; ' + (on ? 'border: 2px solid #111418;' : 'border: 2px solid #DDE1E6;'),
        dotStyle: 'width: 22px; height: 22px; border-radius: 999px; box-sizing: border-box; flex-shrink: 0; ' + (on ? 'border: 7px solid #111418; background: ' + accent + ';' : 'border: 2px solid #9AA1AC; background: #FFFFFF;'),
        pick: () => this.setState({ active: m.id })
      };
    });
    return { accent, models };
  }
}
</script>
</body>
</html>
