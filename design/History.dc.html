<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thalia – History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Noto+Sans+Kannada:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #111418; font-family: Inter, 'Noto Sans Kannada', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">History</div>
      <div style="font-size: 13px; color: #565D68">Every recording, with its audio and job card</div>
    </div>

    <div style="display: flex; gap: 8px">
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 12px; padding: 0 12px; min-height: 48px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search recordings</span>
        <input type="search" placeholder="Search a part, vehicle or word" style="border: 0; outline: none; background: transparent; font-family: Inter, sans-serif; font-size: 15px; color: #111418; flex-grow: 1; min-width: 0">
      </label>
      <button type="button" aria-label="Search by voice" style="width: 48px; height: 48px; border-radius: 12px; border: 0; background: #111418; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
      </button>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #565D68">{{g.label}}</div>
        <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
          <div style="{{r.cardStyle}}">
            <div style="display: flex; align-items: center; gap: 12px">
              <button type="button" onClick="{{r.toggle}}" aria-label="{{r.playLabel}}" style="{{r.playStyle}}">
                <sc-if value="{{r.playing}}" hint-placeholder-val="{{ false }}">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
                </sc-if>
                <sc-if value="{{r.stopped}}" hint-placeholder-val="{{ true }}">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>
                </sc-if>
              </button>
              <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <div style="font-size: 15px; font-weight: 700">{{r.vehicle}} · {{r.title}}</div>
                <div style="font-size: 12px; color: #565D68">{{r.time}} · {{r.duration}}</div>
              </div>
              <div style="{{r.statusStyle}}">{{r.status}}</div>
            </div>

            <div aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 28px">
              <sc-for list="{{r.bars}}" as="b" hint-placeholder-count="48">
                <div style="{{b}}"></div>
              </sc-for>
            </div>

            <div style="font-family: 'Noto Sans Kannada', Inter, sans-serif; font-size: 14px; color: #3B414A; line-height: 1.5">{{r.snippet}}</div>

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{r.terms}}" as="t" hint-placeholder-count="2">
                  <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #FDEFD2; color: #6B4100">{{t}}</span>
                </sc-for>
              </div>
              <a href="JobCard.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 36px; font-size: 13px; font-weight: 700; white-space: nowrap">Job card
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
              </a>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE1E6; padding: 8px 8px 26px 8px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg></span>Record</a>
    <a href="History.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 700">
      <span style="display: flex; padding: 4px 16px; border-radius: 999px; background: {{accent}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg></span>History</a>
    <a href="Models.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg></span>Models</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FFD23F","#4CC38A","#7AB8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: 'r1' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const recs = [
      { id: 'r1', group: 'Today', vehicle: 'Bajaj NS200', title: 'Coolant service', time: '11:40 AM', duration: '0:48', status: 'Draft', snippet: 'ಇಲ್ಲಿ drain bolt ತೆಗೆದು ಬರಲಿಲ್ಲ coolant. coolant ಎಳ್ಕೊಳೋಕೆ air out ಆಗ್ಬೇಕು…', terms: ['drain bolt', 'coolant', 'air out'], seed: 3 },
      { id: 'r2', group: 'Yesterday', vehicle: 'Honda Activa', title: 'No pickup', time: '4:15 PM', duration: '0:32', status: 'Saved', snippet: 'ಈ bikeಗೆ clutch plate ಹೋಗಿದೆ, ಅದಕ್ಕೇ pickup ಬರ್ತಿಲ್ಲ', terms: ['clutch plate', 'pickup'], seed: 7 },
      { id: 'r3', group: 'Yesterday', vehicle: 'Maruti Swift', title: 'Exhaust noise', time: '10:05 AM', duration: '1:05', status: 'Saved', snippet: 'silencer ಇಂದ sound ಬರ್ತಿದೆ, joint ನೋಡ್ಬೇಕು', terms: ['silencer'], seed: 11 }
    ];
    const toItem = (r) => {
      const on = this.state.playing === r.id;
      const bars = [];
      for (let i = 0; i < 48; i++) {
        const h = 6 + Math.round(Math.abs(Math.sin((i + 1) * 0.9 + r.seed) * Math.cos(i * 0.37 + r.seed)) * 20);
        const played = on && i < 19;
        bars.push('width: 3px; flex-grow: 1; border-radius: 2px; height: ' + h + 'px; background: ' + (played ? '#111418' : '#C9CED5') + ';');
      }
      return {
        ...r,
        bars,
        playing: on,
        stopped: !on,
        duration: on ? '0:18 / ' + r.duration : r.duration,
        playLabel: (on ? 'Pause ' : 'Play ') + r.vehicle + ' recording',
        playStyle: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #111418;' : 'background: #111418; color: #FFFFFF;'),
        cardStyle: 'display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px; ' + (on ? 'border: 2px solid #111418;' : 'border: 1px solid #DDE1E6;'),
        statusStyle: r.status === 'Draft'
          ? 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #E4E7EB; color: #3B414A;'
          : 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #111418; color: #FFFFFF;',
        toggle: () => this.setState({ playing: on ? null : r.id })
      };
    };
    const groups = ['Today', 'Yesterday'].map((label) => ({ label, items: recs.filter((r) => r.group === label).map(toItem) }));
    return { accent, groups };
  }
}
</script>
</body>
</html>
