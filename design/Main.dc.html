<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thalia – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Noto+Sans+Kannada:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111418;text-decoration:none}a:hover{color:#111418}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; font-family: Inter, 'Noto Sans Kannada', sans-serif; color: #111418; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.1">Thalia</div>
          <div style="font-family: 'Noto Sans Kannada', sans-serif; font-size: 12px; color: #565D68">ಥಾಲಿಯಾ</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #111418; color: #F3F4F6; font-size: 12px; font-weight: 600">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg>
        Offline · on-device
      </div>
    </div>

    <a href="Models.dc.html" style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 14px; padding: 12px 14px; min-height: 44px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #565D68">Active model</div>
        <div style="font-size: 15px; font-weight: 600">mech-whisper-small · int8</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #565D68">Change
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 600; color: #565D68">Vehicle on the bay</div>
      <div role="group" aria-label="Vehicle type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E4E7EB; padding: 4px; border-radius: 12px">
        <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="3">
          <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="{{v.style}}">{{v.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 0 4px 0">
      <a href="Recording.dc.html" aria-label="Start recording" style="width: 148px; height: 148px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 12px rgba(245,165,36,0.22), 0 0 0 26px rgba(245,165,36,0.10)">
        <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#111418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 14px">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Tap and describe the job</div>
        <div style="font-family: 'Noto Sans Kannada', Inter, sans-serif; font-size: 14px; color: #565D68; text-align: center">ಕನ್ನಡದಲ್ಲಿ ಮಾತಾಡಿ — English part names are fine</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 13px; font-weight: 600; color: #565D68">Recent recordings</div>
        <a href="History.dc.html" style="font-size: 13px; font-weight: 600; padding: 4px 0">See all</a>
      </div>
      <a href="History.dc.html" style="display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 14px; padding: 12px 14px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 15px; font-weight: 600">Bajaj NS200 · Coolant service</div>
          <div style="font-size: 12px; color: #565D68">0:48</div>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #FDEFD2; color: #6B4100">drain bolt</span>
          <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #FDEFD2; color: #6B4100">coolant</span>
          <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #FDEFD2; color: #6B4100">air out</span>
        </div>
      </a>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE1E6; padding: 8px 8px 26px 8px">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 700">
      <span style="display: flex; padding: 4px 16px; border-radius: 999px; background: {{accent}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg></span>Record</a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg></span>History</a>
    <a href="Models.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 500; color: #565D68">
      <span style="display: flex; padding: 4px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg></span>Models</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FFD23F","#4CC38A","#7AB8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vehicle: 'Bike' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const base = 'min-height: 44px; border: 0; border-radius: 9px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; ';
    const vehicles = ['Bike', 'Scooter', 'Car'].map((label) => {
      const on = this.state.vehicle === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: #FFFFFF; color: #111418; box-shadow: 0 1px 3px rgba(17,20,24,0.15);' : 'background: transparent; color: #565D68;'),
        pick: () => this.setState({ vehicle: label })
      };
    });
    return { accent, vehicles };
  }
}
</script>
</body>
</html>
